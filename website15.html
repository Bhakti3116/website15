<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(45deg, #1e3c72, #2a5298);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .login-box {
    background: white;
    padding: 30px;
    width: 320px;
    border-radius: 10px;
    box-shadow: 0 2px 15px rgba(0,0,0,0.3);
    text-align: center;
  }

  h2 {
    color: #2a5298;
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
  }

  button {
    width: 100%;
    padding: 10px;
    background: #2a5298;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background: #1e3c72;
  }

  .footer-text {
    margin-top: 10px;
    font-size: 12px;
    color: gray;
  }
</style>
</head>

<body>

<div class="login-box">
  <h2>Student Login</h2>

  <form>
    <input type="text" placeholder="Enter Username" required>
    <input type="password" placeholder="Enter Password" required>

    <button type="submit">Login</button>
  </form>

  <div class="footer-text">
    © 2026 School Portal
  </div>
</div>

</body>
</html>
